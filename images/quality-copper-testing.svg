<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Quality copper winding, Nomex insulation and Megger electrical testing">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="qCopperSpool" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#qBg)"/>

  <!-- Technical Bench Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Left Side: Industrial Heavy Copper Wire Spool -->
  <g transform="translate(140, 240)">
    <!-- Wooden/Steel Spool Flanges -->
    <ellipse cx="0" cy="-90" rx="90" ry="24" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="0" cy="90" rx="90" ry="24" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Cylinder of Wound Copper Wire -->
    <rect x="-85" y="-90" width="170" height="180" fill="url(#qCopperSpool)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Wire Ribs / Texture -->
    <g stroke="#f59e0b" stroke-width="1.5" opacity="0.7">
      <line x1="-85" y1="-70" x2="85" y2="-70"/>
      <line x1="-85" y1="-50" x2="85" y2="-50"/>
      <line x1="-85" y1="-30" x2="85" y2="-30"/>
      <line x1="-85" y1="-10" x2="85" y2="-10"/>
      <line x1="-85" y1="10" x2="85" y2="10"/>
      <line x1="-85" y1="30" x2="85" y2="30"/>
      <line x1="-85" y1="50" x2="85" y2="50"/>
      <line x1="-85" y1="70" x2="85" y2="70"/>
    </g>
    <!-- Wire unwinding strand to right -->
    <path d="M85 30 C 130 30, 160 120, 220 120" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Spool Label -->
    <rect x="-45" y="-20" width="90" height="40" rx="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="-3" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle">SUPER ENAMELED</text>
    <text x="0" y="12" font-family="'Inter', sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">99.9% ELECTROLYTIC</text>
  </g>

  <!-- Right Side: Stator Core & Testing Station -->
  <g transform="translate(540, 240)">
    <!-- Stator Core Section -->
    <rect x="-140" y="-120" width="280" height="240" rx="12" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    
    <!-- Internal Coils with Nomex Class H White Insulation -->
    <g fill="none" stroke="#d97706" stroke-width="12" stroke-linecap="round">
      <path d="M-100 -80 C-40 -110, 40 -110, 100 -80 L100 80 C40 110, -40 110, -100 80 Z"/>
      <path d="M-60 -50 C-20 -70, 20 -70, 60 -50 L60 50 C20 70, -20 70, -60 50 Z"/>
    </g>

    <!-- Nomex Class H Insulation Wrap (White bands) -->
    <rect x="-110" y="-35" width="220" height="16" fill="#fef08a" stroke="#ca8a04" stroke-width="1" rx="2" opacity="0.9"/>
    <rect x="-110" y="20" width="220" height="16" fill="#fef08a" stroke="#ca8a04" stroke-width="1" rx="2" opacity="0.9"/>

    <!-- Megger Insulation Resistance Digital Meter -->
    <g transform="translate(-110, -180)">
      <rect x="0" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="15" y="15" width="120" height="40" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1"/>
      <text x="125" y="42" font-family="'Outfit', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="end">&gt; 500 MΩ</text>
      <text x="22" y="30" font-family="'Inter', sans-serif" font-size="8" fill="#64748b">1000V DC TEST</text>
      
      <!-- Status Indicator Pill -->
      <rect x="145" y="22" width="60" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="158" cy="35" r="4" fill="#10b981"/>
      <text x="182" y="39" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">PASS</text>

      <!-- Testing Probes connected to Winding -->
      <path d="M40 55 C 40 100, 20 90, -10 130" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M100 55 C 100 120, 150 90, 80 130" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Quality Stamp -->
  <g transform="translate(350, 390)">
    <rect x="0" y="0" width="220" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="30" cy="27" r="14" fill="#10b981" fill-opacity="0.15"/>
    <path d="M23 27 L28 32 L37 22" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#ffffff">PRE-DELIVERY TESTED</text>
    <text x="56" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Megger Insulation + Current Balance</text>
  </g>
</svg>
