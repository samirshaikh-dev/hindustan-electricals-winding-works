<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="DC motor armature rewinding and commutator overhaul">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="commCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="armatureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dcBg)"/>

  <!-- DC Motor Armature & Commutator Assembly -->
  <g transform="translate(300, 200)">
    <!-- Central Heavy Steel Shaft -->
    <rect x="-240" y="-18" width="480" height="36" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>

    <!-- Laminated Armature Core (Slotted Cylindrical Core) -->
    <rect x="-140" y="-95" width="170" height="190" rx="8" fill="url(#armatureGrad)" stroke="#475569" stroke-width="2"/>

    <!-- Slotted Armature Copper Coils (Diamond loop windings) -->
    <g fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round">
      <path d="M-135 -85 L-90 -105 L-5 -85 L-5 85 L-90 105 L-135 85 Z"/>
      <path d="M-135 -60 L-90 -80 L-5 -60 L-5 60 L-90 80 L-135 60 Z"/>
      <path d="M-135 -35 L-90 -55 L-5 -35 L-5 35 L-90 55 L-135 35 Z"/>
      <path d="M-135 -10 L-90 -30 L-5 -10 L-5 10 L-90 30 L-135 10 Z"/>
      <path d="M-135 15 L-90 -5 L-5 15 L-5 -15 L-90 5 L-135 -15 Z"/>
      <path d="M-135 40 L-90 20 L-5 40 L-5 -40 L-90 -20 L-135 -40 Z"/>
    </g>

    <!-- Glass Tape Armature Binding Band -->
    <rect x="-120" y="-96" width="18" height="192" fill="#f8fafc" opacity="0.75"/>
    <rect x="-25" y="-96" width="18" height="192" fill="#f8fafc" opacity="0.75"/>

    <!-- COPPER COMMUTATOR (Segmented Cylinder with Riser Bars) -->
    <!-- Commutator Riser Connections (Soldered Coil Ends) -->
    <rect x="35" y="-72" width="22" height="144" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
    <g stroke="#fbbf24" stroke-width="1.5">
      <line x1="35" y1="-60" x2="57" y2="-60"/>
      <line x1="35" y1="-40" x2="57" y2="-40"/>
      <line x1="35" y1="-20" x2="57" y2="-20"/>
      <line x1="35" y1="0" x2="57" y2="0"/>
      <line x1="35" y1="20" x2="57" y2="20"/>
      <line x1="35" y1="40" x2="57" y2="40"/>
      <line x1="35" y1="60" x2="57" y2="60"/>
    </g>

    <!-- Commutator Drum -->
    <rect x="57" y="-60" width="85" height="120" rx="4" fill="url(#commCopper)" stroke="#b45309" stroke-width="2"/>
    <!-- Commutator Segments & Mica Undercutting -->
    <g stroke="#0f172a" stroke-width="2">
      <line x1="57" y1="-48" x2="142" y2="-48"/>
      <line x1="57" y1="-36" x2="142" y2="-36"/>
      <line x1="57" y1="-24" x2="142" y2="-24"/>
      <line x1="57" y1="-12" x2="142" y2="-12"/>
      <line x1="57" y1="0" x2="142" y2="0"/>
      <line x1="57" y1="12" x2="142" y2="12"/>
      <line x1="57" y1="24" x2="142" y2="24"/>
      <line x1="57" y1="36" x2="142" y2="36"/>
      <line x1="57" y1="48" x2="142" y2="48"/>
    </g>

    <!-- Carbon Brush & Brush Holder Assembly -->
    <g transform="translate(85, -100)">
      <!-- Top Carbon Brush -->
      <rect x="0" y="0" width="28" height="38" rx="2" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <!-- Copper Pigtail Lead -->
      <path d="M14 0 C 14 -20, 45 -20, 45 -10" stroke="#f59e0b" stroke-width="3" fill="none"/>
      <!-- Brass Brush Holder Box -->
      <rect x="-4" y="-8" width="36" height="24" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" opacity="0.9"/>
    </g>
  </g>

  <!-- Tag overlay -->
  <rect x="24" y="24" width="180" height="34" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#d97706" stroke-width="1.5"/>
  <text x="36" y="46" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="0.5">DC ARMATURE &amp; BRUSHES</text>
</svg>
