<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Electrical testing panel with analog ammeters and insulation Megger">
  <defs>
    <linearGradient id="wtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#wtBg)"/>

  <!-- Industrial Electrical Testing Control Panel -->
  <g transform="translate(300, 200)">
    <!-- Panel Body -->
    <rect x="-240" y="-140" width="480" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>

    <!-- 3 Analog Phase Meters (R - Y - B Current Ammeters) -->
    <!-- Meter 1 -->
    <g transform="translate(-140, -50)">
      <circle cx="0" cy="0" r="50" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
      <path d="M-30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="20" x2="15" y2="-25" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="20" r="5" fill="#0f172a"/>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">R-PHASE (A)</text>
    </g>

    <!-- Meter 2 -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="50" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
      <path d="M-30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="20" x2="14" y2="-25" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="20" r="5" fill="#0f172a"/>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">Y-PHASE (A)</text>
    </g>

    <!-- Meter 3 -->
    <g transform="translate(140, -50)">
      <circle cx="0" cy="0" r="50" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
      <path d="M-30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="0" y1="20" x2="16" y2="-25" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="20" r="5" fill="#0f172a"/>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#3b82f6" text-anchor="middle">B-PHASE (A)</text>
    </g>

    <!-- Control Switches & Terminals -->
    <g transform="translate(0, 80)">
      <!-- Main Breaker Handle -->
      <rect x="-180" y="-15" width="40" height="30" rx="4" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
      <text x="-160" y="6" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">ON</text>

      <!-- Variac / Voltage Adjust Knob -->
      <circle cx="-50" cy="0" r="26" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <line x1="-50" y1="0" x2="-40" y2="-20" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
      <text x="-50" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">0 - 500V</text>

      <!-- Pass/Verify Lamp -->
      <circle cx="50" cy="0" r="16" fill="#10b981" stroke="#059669" stroke-width="2"/>
      <circle cx="46" cy="-4" r="4" fill="#ffffff" opacity="0.6"/>
      <text x="50" y="30" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#10b981" text-anchor="middle">BALANCED</text>

      <!-- Test Terminals -->
      <circle cx="130" cy="0" r="10" fill="#ef4444"/>
      <circle cx="160" cy="0" r="10" fill="#eab308"/>
      <circle cx="190" cy="0" r="10" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Tag overlay -->
  <rect x="24" y="24" width="190" height="34" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5"/>
  <text x="36" y="46" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="0.5">CURRENT &amp; LOAD TEST</text>
</svg>
