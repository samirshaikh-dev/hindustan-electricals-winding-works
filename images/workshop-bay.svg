<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Workshop bay at Express House, GIDC Vapi">
  <defs>
    <linearGradient id="bayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bayBg)"/>

  <!-- Industrial Workshop Bay Structure -->
  <!-- Overhead Gantry Crane Beam -->
  <rect x="0" y="30" width="600" height="35" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
  <!-- Safety Stripes on Crane -->
  <g stroke="#18181b" stroke-width="12">
    <line x1="20" y1="30" x2="50" y2="65"/>
    <line x1="80" y1="30" x2="110" y2="65"/>
    <line x1="140" y1="30" x2="170" y2="65"/>
    <line x1="200" y1="30" x2="230" y2="65"/>
    <line x1="260" y1="30" x2="290" y2="65"/>
    <line x1="320" y1="30" x2="350" y2="65"/>
    <line x1="380" y1="30" x2="410" y2="65"/>
    <line x1="440" y1="30" x2="470" y2="65"/>
    <line x1="500" y1="30" x2="530" y2="65"/>
    <line x1="560" y1="30" x2="590" y2="65"/>
  </g>

  <!-- Crane Hoist Trolley & Hook -->
  <rect x="260" y="65" width="80" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="95" x2="300" y2="150" stroke="#94a3b8" stroke-width="4"/>
  <!-- Crane Hook -->
  <path d="M295 150 C 295 180, 315 180, 315 165 C 315 155, 305 155, 300 162" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Workshop Floor & Heavy Industrial Workbenches -->
  <path d="M0 260 L600 260 L600 400 L0 400 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#334155" stroke-width="2"/>

  <!-- Heavy Motor on Repair Stand -->
  <g transform="translate(180, 220)">
    <!-- Stand -->
    <rect x="30" y="50" width="180" height="40" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Large Industrial Motor Body -->
    <rect x="40" y="-40" width="160" height="90" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Cooling Fins -->
    <path d="M55 -40 V50 M75 -40 V50 M95 -40 V50 M115 -40 V50 M135 -40 V50 M155 -40 V50 M175 -40 V50" stroke="#475569" stroke-width="5"/>
    <!-- Terminal Box -->
    <rect x="90" y="-60" width="60" height="22" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <!-- Shaft with Sling -->
    <rect x="-10" y="0" width="50" height="22" fill="#cbd5e1"/>
    <!-- Hoist Lifting Webbing Sling -->
    <path d="M120 -80 L10 0 L120 50" stroke="#eab308" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tag overlay -->
  <rect x="24" y="24" width="190" height="34" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="46" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.5">WORKSHOP REPAIR BAY</text>
</svg>
