<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Motor insulation Megger testing and continuity check">
  <defs>
    <linearGradient id="g5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g5Bg)"/>

  <!-- High-Voltage Insulation Tester -->
  <g transform="translate(300, 210)">
    <rect x="-160" y="-100" width="320" height="200" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Big Analog Dual Scale Dial -->
    <circle cx="0" cy="-15" r="65" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <path d="M-45 -15 A 45 45 0 0 1 45 -15" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="20" x2="32" y2="-45" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="6" fill="#0f172a"/>
    <text x="0" y="-30" font-family="'Outfit', monospace" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">&gt; 1000 MΩ</text>

    <!-- Test Leads & High Voltage Terminals -->
    <circle cx="-90" cy="55" r="12" fill="#ef4444"/>
    <circle cx="90" cy="55" r="12" fill="#18181b"/>
    <path d="M-90 67 C -90 120, -180 120, -220 80" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M90 67 C 90 120, 180 120, 220 80" stroke="#18181b" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <rect x="20" y="390" width="220" height="40" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
  <text x="32" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Megger Insulation Test</text>
</svg>
