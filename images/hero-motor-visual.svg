<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="Industrial electric motor rewinding and copper coil assembly at Hindustan Electricals workshop">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="heroDarkBg" cx="60%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c14"/>
    </radialGradient>
    <radialGradient id="copperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <!-- Metal and copper wire gradients -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="copperGrad1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="copperGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="shaftSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="statorCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Workshop Background with technical grid -->
  <rect width="1000" height="680" fill="url(#heroDarkBg)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 80 H1000 M0 160 H1000 M0 240 H1000 M0 320 H1000 M0 400 H1000 M0 480 H1000 M0 560 H1000 M0 640 H1000" />
    <path d="M100 0 V680 M200 0 V680 M300 0 V680 M400 0 V680 M500 0 V680 M600 0 V680 M700 0 V680 M800 0 V680 M900 0 V680" />
  </g>

  <!-- Ambient Copper Glow -->
  <circle cx="620" cy="340" r="300" fill="url(#copperGlow)"/>

  <!-- WORKSHOP BENCH SURFACE -->
  <path d="M220 540 L880 540 L960 640 L140 640 Z" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <line x1="140" y1="640" x2="960" y2="640" stroke="#334155" stroke-width="3"/>

  <!-- INDUSTRIAL MOTOR ASSEMBLY (Cutaway & Rewinding View) -->
  <g filter="url(#shadowFilter)">
    <!-- Base Mounting Feet -->
    <rect x="360" y="500" width="80" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="400" cy="522" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="740" y="500" width="80" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="780" cy="522" r="7" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

    <!-- Heavy Cast Iron Motor Frame / Stator Housing -->
    <rect x="380" y="160" width="420" height="350" rx="14" fill="url(#casingGrad)" stroke="#475569" stroke-width="3"/>

    <!-- Cast Iron Cooling Ribs / Fins -->
    <path d="M410 160 V510 M440 160 V510 M470 160 V510 M500 160 V510 M530 160 V510 M560 160 V510 M590 160 V510 M620 160 V510 M650 160 V510 M680 160 V510 M710 160 V510 M740 160 V510 M770 160 V510" 
          stroke="url(#finGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Terminal Connection Box on Top -->
    <rect x="520" y="90" width="140" height="74" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <path d="M535 90 L550 72 L645 72 L660 90 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="590" cy="126" r="6" fill="#f59e0b"/>
    <text x="590" y="115" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">415V 3-PHASE</text>

    <!-- Drive-End Bearing Housing & Flange -->
    <ellipse cx="380" cy="335" rx="55" ry="175" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <ellipse cx="380" cy="335" rx="42" ry="140" fill="#0f172a" stroke="#475569" stroke-width="2"/>

    <!-- Hardened Alloy Steel Output Shaft -->
    <rect x="220" y="305" width="160" height="60" rx="4" fill="url(#shaftSteel)" stroke="#64748b" stroke-width="2"/>
    <!-- Keyway on Shaft -->
    <rect x="245" y="325" width="80" height="18" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="220" cy="335" rx="14" ry="30" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>

    <!-- CUTAWAY INSPECTION WINDOW: SHOWING PRECISION STATOR & COPPER WINDINGS -->
    <g transform="translate(480, 200)">
      <!-- Cutaway Aperture Outer Border -->
      <rect x="0" y="0" width="310" height="270" rx="10" fill="#090d16" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 5"/>

      <!-- Laminated Silicon Steel Stator Core & Teeth -->
      <rect x="15" y="15" width="280" height="240" rx="6" fill="url(#statorCore)" stroke="#334155" stroke-width="1.5"/>
      <g stroke="#1e293b" stroke-width="2">
        <line x1="15" y1="45" x2="295" y2="45"/>
        <line x1="15" y1="75" x2="295" y2="75"/>
        <line x1="15" y1="105" x2="295" y2="105"/>
        <line x1="15" y1="135" x2="295" y2="135"/>
        <line x1="15" y1="165" x2="295" y2="165"/>
        <line x1="15" y1="195" x2="295" y2="195"/>
        <line x1="15" y1="225" x2="295" y2="225"/>
      </g>

      <!-- Slot Insulation Liners (Nomex / Mylar Class H) -->
      <g fill="#fef3c7" opacity="0.85">
        <rect x="30" y="25" width="8" height="220" rx="2"/>
        <rect x="70" y="25" width="8" height="220" rx="2"/>
        <rect x="110" y="25" width="8" height="220" rx="2"/>
        <rect x="150" y="25" width="8" height="220" rx="2"/>
        <rect x="190" y="25" width="8" height="220" rx="2"/>
        <rect x="230" y="25" width="8" height="220" rx="2"/>
        <rect x="270" y="25" width="8" height="220" rx="2"/>
      </g>

      <!-- SUPER-ENAMELED ELECTROLYTIC COPPER COILS (Dense, Realistic Winding Bundles) -->
      <!-- Coil Bundle 1 -->
      <path d="M26 30 C 50 15, 60 15, 78 30 L 78 240 C 60 255, 50 255, 26 240 Z" fill="url(#copperGrad1)" stroke="#b45309" stroke-width="1.5"/>
      <!-- Coil Bundle 2 -->
      <path d="M66 30 C 90 15, 100 15, 118 30 L 118 240 C 100 255, 90 255, 66 240 Z" fill="url(#copperGrad2)" stroke="#b45309" stroke-width="1.5"/>
      <!-- Coil Bundle 3 -->
      <path d="M106 30 C 130 15, 140 15, 158 30 L 158 240 C 140 255, 130 255, 106 240 Z" fill="url(#copperGrad1)" stroke="#b45309" stroke-width="1.5"/>
      <!-- Coil Bundle 4 -->
      <path d="M146 30 C 170 15, 180 15, 198 30 L 198 240 C 180 255, 170 255, 146 240 Z" fill="url(#copperGrad2)" stroke="#b45309" stroke-width="1.5"/>
      <!-- Coil Bundle 5 -->
      <path d="M186 30 C 210 15, 220 15, 238 30 L 238 240 C 220 255, 210 255, 186 240 Z" fill="url(#copperGrad1)" stroke="#b45309" stroke-width="1.5"/>
      <!-- Coil Bundle 6 -->
      <path d="M226 30 C 250 15, 260 15, 278 30 L 278 240 C 260 255, 250 255, 226 240 Z" fill="url(#copperGrad2)" stroke="#b45309" stroke-width="1.5"/>

      <!-- Individual Strands & Coil Lacing Ties -->
      <g stroke="#fef08a" stroke-width="1" opacity="0.65">
        <line x1="32" y1="50" x2="72" y2="50"/>
        <line x1="32" y1="80" x2="72" y2="80"/>
        <line x1="32" y1="120" x2="72" y2="120"/>
        <line x1="32" y1="160" x2="72" y2="160"/>
        <line x1="32" y1="200" x2="72" y2="200"/>

        <line x1="72" y1="60" x2="112" y2="60"/>
        <line x1="72" y1="100" x2="112" y2="100"/>
        <line x1="72" y1="140" x2="112" y2="140"/>
        <line x1="72" y1="180" x2="112" y2="180"/>
        <line x1="72" y1="220" x2="112" y2="220"/>

        <line x1="112" y1="50" x2="152" y2="50"/>
        <line x1="112" y1="90" x2="152" y2="90"/>
        <line x1="112" y1="130" x2="152" y2="130"/>
        <line x1="112" y1="170" x2="152" y2="170"/>

        <line x1="152" y1="70" x2="192" y2="70"/>
        <line x1="152" y1="110" x2="192" y2="110"/>
        <line x1="152" y1="150" x2="192" y2="150"/>
        <line x1="152" y1="190" x2="192" y2="190"/>

        <line x1="192" y1="55" x2="232" y2="55"/>
        <line x1="192" y1="95" x2="232" y2="95"/>
        <line x1="192" y1="135" x2="232" y2="135"/>
        <line x1="192" y1="175" x2="232" y2="175"/>
      </g>

      <!-- White Glass-Cloth Winding Lacing Cord -->
      <path d="M22 65 Q 40 85, 282 75 M22 195 Q 40 215, 282 205" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 4" fill="none" opacity="0.9"/>

      <!-- Technical Spec Badge overlay inside cutaway -->
      <rect x="15" y="195" width="135" height="50" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
      <text x="25" y="215" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">PURE COPPER</text>
      <text x="25" y="232" font-family="'Inter', sans-serif" font-size="9" fill="#e2e8f0">Class F/H Insulation</text>
    </g>

    <!-- Non-Drive End Bearing Bracket & Cooling Fan Cowl -->
    <path d="M780 200 L840 220 L840 450 L780 470 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
    <path d="M840 240 L880 260 L880 410 L840 430 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Louvered Air Vents -->
    <line x1="850" y1="280" x2="870" y2="290" stroke="#64748b" stroke-width="3"/>
    <line x1="850" y1="310" x2="870" y2="320" stroke="#64748b" stroke-width="3"/>
    <line x1="850" y1="340" x2="870" y2="350" stroke="#64748b" stroke-width="3"/>
    <line x1="850" y1="370" x2="870" y2="380" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- DIAGNOSTIC TESTING PROBE & MEGGER METER ON WORKBENCH -->
  <g transform="translate(140, 420)">
    <!-- Digital Insulation Tester / Multimeter -->
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- LCD Display -->
    <rect x="15" y="15" width="100" height="35" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="95" y="38" font-family="'Outfit', monospace" font-size="16" font-weight="700" fill="#10b981" text-anchor="end">999 MΩ</text>
    <text x="22" y="32" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8">MEGGER 1kV</text>
    <circle cx="35" cy="68" r="6" fill="#ef4444"/>
    <circle cx="65" cy="68" r="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="95" cy="68" r="6" fill="#22c55e"/>

    <!-- Probe lead connecting to motor coil -->
    <path d="M35 74 C 40 140, 260 120, 440 -120" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="0"/>
    <circle cx="440" cy="-120" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- VERIFIED WORKSHOP BADGE (Top Right) -->
  <g transform="translate(760, 40)">
    <rect x="0" y="0" width="200" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="16" fill="#f59e0b" fill-opacity="0.15"/>
    <path d="M26 32 L30 36 L39 27" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">WORKSHOP TESTED</text>
    <text x="60" y="46" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Express House, GIDC Vapi</text>
  </g>
</svg>
