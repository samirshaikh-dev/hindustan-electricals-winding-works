<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="High-grade super enameled copper winding coils and insulation rolls">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="g3Copper" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g3Bg)"/>

  <!-- Pre-formed Copper Coils on Bench -->
  <g transform="translate(240, 210)">
    <!-- Set of 4 concentric Diamond Winding Coils -->
    <path d="M-160 -110 L-70 -130 L10 -110 L10 110 L-70 130 L-160 110 Z" fill="none" stroke="url(#g3Copper)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-125 -85 L-55 -100 L5 -85 L5 85 L-55 100 L-125 85 Z" fill="none" stroke="url(#g3Copper)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-90 -60 L-40 -70 L0 -60 L0 60 L-40 70 L-90 60 Z" fill="none" stroke="url(#g3Copper)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Insulation Materials (Nomex / Mylar roll) -->
  <g transform="translate(450, 210)">
    <rect x="-40" y="-120" width="80" height="240" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="0" cy="-120" rx="40" ry="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle" transform="rotate(-90)">CLASS F / H INSULATION</text>
  </g>

  <rect x="20" y="390" width="240" height="40" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
  <text x="32" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Pure Electrolytic Copper Coils</text>
</svg>
