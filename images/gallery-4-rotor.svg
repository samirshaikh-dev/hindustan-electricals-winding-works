<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Rotor balancing and vibration check on dynamic balancing machine">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g4Bg)"/>

  <!-- Balancing Machine Pedestals -->
  <g transform="translate(300, 220)">
    <!-- Base -->
    <rect x="-220" y="80" width="440" height="30" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Left Stanchion / Pedestal -->
    <path d="M-150 80 L-140 -20 L-100 -20 L-90 80 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="-120" cy="-20" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Right Stanchion / Pedestal -->
    <path d="M90 80 L100 -20 L140 -20 L150 80 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="-20" r="16" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>

    <!-- Heavy Industrial Rotor Resting on Bearings -->
    <rect x="-240" y="-30" width="480" height="20" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-70" y="-70" width="140" height="100" rx="6" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <!-- Rotor Skewed Slot Bars -->
    <g stroke="#334155" stroke-width="3">
      <line x1="-50" y1="-65" x2="-40" y2="25"/>
      <line x1="-20" y1="-65" x2="-10" y2="25"/>
      <line x1="10" y1="-65" x2="20" y2="25"/>
      <line x1="40" y1="-65" x2="50" y2="25"/>
    </g>

    <!-- Balancing Laser Optical Sensor Pick-up -->
    <g transform="translate(0, -110)">
      <rect x="-20" y="0" width="40" height="24" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <line x1="0" y1="24" x2="0" y2="40" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="0" cy="40" r="3" fill="#ef4444"/>
    </g>
  </g>

  <rect x="20" y="390" width="230" height="40" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
  <text x="32" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Dynamic Rotor Balancing</text>
</svg>
