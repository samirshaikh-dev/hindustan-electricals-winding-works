<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Motor rewinding and copper coil insertion in GIDC Vapi">
  <defs>
    <linearGradient id="g1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b111e"/>
    </linearGradient>
    <linearGradient id="g1Copper" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#g1Bg)"/>
  
  <!-- Stator Frame Core -->
  <g transform="translate(300, 225)">
    <circle cx="0" cy="0" r="170" fill="#0f172a" stroke="#334155" stroke-width="24"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#475569" stroke-width="2"/>
    
    <!-- 18 Slot Copper Coils -->
    <g fill="none" stroke="url(#g1Copper)" stroke-width="14" stroke-linecap="round">
      <path d="M-130 -40 C-80 -130 80 -130 130 -40"/>
      <path d="M-140 0 C-90 -110 90 -110 140 0"/>
      <path d="M-130 40 C-80 130 80 130 130 40"/>
      <path d="M-40 -130 C-130 -80 -130 80 -40 130"/>
      <path d="M0 -140 C-110 -90 -110 90 0 140"/>
      <path d="M40 -130 C130 -80 130 80 40 130"/>
    </g>

    <!-- White Phase Dividers / Nomex Paper -->
    <g fill="#fef08a" stroke="#ca8a04" stroke-width="1">
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(15)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(45)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(75)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(105)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(135)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(165)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(195)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(225)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(255)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(285)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(315)"/>
      <rect x="-135" y="-8" width="16" height="16" rx="2" transform="rotate(345)"/>
    </g>
    <circle cx="0" cy="0" r="95" fill="#090d16" stroke="#1e293b" stroke-width="3"/>
  </g>
  <rect x="20" y="390" width="220" height="40" rx="6" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1"/>
  <text x="32" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Stator Rewinding in Progress</text>
</svg>
